<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · Stay Type Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient-bg" aria-hidden="true"></div>

<div class="page page-narrow">

  <div id="siteNav"></div>

  <div class="hero">
    <span class="hero-emoji">👋</span>
    <div>
      <span class="hero-eyebrow">Welcome back</span>
      <h1 class="hero-title">Log in</h1>
      <p class="hero-sub">Sign in to check a listing or see the guesses you've made before.</p>
    </div>
  </div>

  <section class="card">
    <form id="loginForm" class="auth-form">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary btn-block" id="loginBtn">
        <span class="btn-label">Log in</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
      <p class="form-error" id="authError" role="alert"></p>
    </form>

    <p class="switch-link">New here? <a href="register.html">Create an account</a></p>
  </section>

  <footer class="page-footer">
    <p>Predictions come from a machine learning model, not a real person — treat them as a fun guess, not a guarantee.</p>
  </footer>
</div>

<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
