<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up · Stay Type Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient-bg" aria-hidden="true"></div>

<div class="page page-narrow">

  <div id="siteNav"></div>

  <div class="hero">
    <span class="hero-emoji">🏡</span>
    <div>
      <span class="hero-eyebrow">Get started</span>
      <h1 class="hero-title">Create an account</h1>
      <p class="hero-sub">Sign up to check listings and keep track of everything you've guessed so far.</p>
    </div>
  </div>

  <section class="card">
    <form id="registerForm" class="auth-form">
      <div class="field">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" name="password" placeholder="At least 8 characters" minlength="8" required>
        <span class="hint">Needs to be 8 characters or more.</span>
      </div>
      <button type="submit" class="btn-primary btn-block" id="registerBtn">
        <span class="btn-label">Sign up</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
      <p class="form-error" id="authError" role="alert"></p>
    </form>

    <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
  </section>

  <footer class="page-footer">
    <p>Predictions come from a machine learning model, not a real person — treat them as a fun guess, not a guarantee.</p>
  </footer>
</div>

<script src="common.js"></script>
<script src="register.js"></script>
</body>
</html>
